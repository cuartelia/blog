name: Publicar Cuartelia
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Configurar rutas para cuartelia.ar
        shell: bash
        run: |
          echo 'SITE_URL=https://cuartelia.ar' >> "$GITHUB_ENV"
          echo 'BASE_PATH=/' >> "$GITHUB_ENV"
      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund
      - name: Ejecutar pruebas de regresión
        run: npm test
      - name: Generar imágenes sociales para artículos publicados
        run: |
          python3 -m pip install --disable-pip-version-check Pillow==11.3.0 CairoSVG==2.7.1
          python3 scripts/social_images.py
      - name: Compilar Astro y generar índice de búsqueda
        env:
          PUBLIC_UMAMI_WEBSITE_ID: ${{ vars.UMAMI_WEBSITE_ID }}
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
